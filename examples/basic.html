<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingView GEX by FlashAlpha: basic example</title>
<script src="../dist/vendor/lightweight-charts-5.3.0.standalone.production.js"></script>
<script src="../dist/tradingview-gex-flashalpha.min.js"></script>
<style>html, body { margin: 0; height: 100%; background: #0f1115; } #chart { height: 100vh; }</style>
</head>
<body>
<div id="chart"></div>
<script>
  const chart = FlashAlphaChart.mount(document.getElementById('chart'), {
    baseUrl: 'https://charts.flashalpha.com',   // FlashAlpha chart API
    apiKey: 'YOUR_API_KEY',                      // your FlashAlpha chart key
    symbol: 'SPX', resolution: '5m',
    layers: ['levels', 'maxpain'],
  });
</script>
</body>
</html>
